name: Cut a release

# Beta first, always. This builds the package, tags it, publishes a GitHub prerelease, and
# submits the item to the Chrome Web Store as a STAGED_PUBLISH: it goes through review and
# is then held rather than going live. Promoting it to everyone is a separate, manual run of
# "Promote a release", which needs no second review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.1. Must be higher than the current one
        type: string
        required: true
      publish_type:
        description: >-
          STAGED_PUBLISH holds the reviewed version until you run Promote a release.
          DEFAULT_PUBLISH sends it live as soon as review approves, with no second step.
        type: choice
        options: [STAGED_PUBLISH, DEFAULT_PUBLISH]
        default: STAGED_PUBLISH
      skip_store:
        description: >-
          Build, sign and attest only. Touches nothing permanent: no commit, no tag, no
          GitHub release, no store upload. Use it to rehearse.
        type: boolean
        default: false

permissions:
  contents: write        # tag, commit the version bump, create the release
  id-token: write        # mint the Google credential, no stored key
  attestations: write    # sign the package we built

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      # Full history and tags. With the default depth of 1 no tags are fetched, so the
      # duplicate-tag guard below would report every tag as missing and happily re-release
      # a version that already exists.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the version is sane and new
        run: |
          v="${{ inputs.version }}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::$v is not a Chrome extension version (1 to 4 dot-separated integers)"
            exit 1
          fi
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "::error::tag v$v already exists"
            exit 1
          fi
          current=$(node -p "require('./manifest.json').version")
          # The store rejects a version that is not higher than the published one, so catch
          # it here rather than after review.
          #
          # Equal to the manifest is allowed, and that is not laxness. The manifest carries
          # the version being prepared, so the first release of 1.0.0 is a release of exactly
          # what the manifest already says. What must never repeat is a released version, and
          # the tag check above is what enforces that.
          highest=$(printf '%s\n%s\n' "$current" "$v" | sort -V | tail -1)
          if [ "$highest" != "$v" ]; then
            echo "::error::$v is lower than the current version $current"
            exit 1
          fi
          if [ "$current" = "$v" ]; then
            echo "releasing $v, which the manifest already carries"
          else
            echo "releasing $current -> $v"
          fi

      # Deliberately does NOT commit or push. The bump is local until a signed package
      # exists, so a build or signing failure leaves the repository untouched and the run
      # can simply be retried. Release 1.0.1 failed after pushing, which left main bumped,
      # a tag pointing at an unreleased commit, and a version gate that refused the retry.
      - name: Set the version locally
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["manifest.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = "${{ inputs.version }}";
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          '


      # After the bump, so the manifest that ships is the manifest that was checked.
      - name: Verify
        run: npm run verify

      - name: Build the package
        id: build
        run: |
          npm run package
          zip=$(ls -1 tailnet-connection-helper-*.zip | head -1)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # Inspects the archive the way the store will. A manifest that references a file the
      # zip does not contain works perfectly when loaded from a local directory, because the
      # file is on disk, and fails only once packaged. Cheaper to catch here than to spend a
      # review cycle on.
      - name: Check the package
        run: node tools/check_package.mjs "${{ steps.build.outputs.zip }}"

      # The item is opted in to verified CRX uploads, so the store accepts nothing but a CRX
      # signed with our key. Chrome does the packing, which is the documented route and
      # avoids hand-rolling CRX3's signed header.
      - name: Install Chrome, for packing
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Pack and sign the CRX
        id: crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # Written with no echo, read-only to the owner, and removed in the cleanup step
          # below whatever happens afterwards.
          umask 077
          printf '%s\n' "$CRX_PRIVATE_KEY" > signing-key.pem
          if ! head -1 signing-key.pem | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::CRX_PRIVATE_KEY is not a PEM private key"
            exit 1
          fi
          # --no-sandbox because the runner has no usable sandbox: Chrome aborts with
          # "No usable sandbox!" and exit 133 without it. Safe here, since this invocation
          # only packs a directory and renders no untrusted content.
          "${{ steps.chrome.outputs.chrome-path }}" \
            --no-sandbox \
            --pack-extension="$PWD/dist" \
            --pack-extension-key="$PWD/signing-key.pem"
          crx="tailnet-connection-helper-${{ inputs.version }}.crx"
          mv dist.crx "$crx"
          echo "crx=$crx" >> "$GITHUB_OUTPUT"
          echo "packed $crx ($(stat -c%s "$crx") bytes)"
          # The Cr24 contract is defined once, in the script that uploads. This step used to
          # reimplement it with `head -c 4`, which disagreed with the script on a four-byte
          # file and had nothing keeping the two in step.
          node tools/check_package.mjs "$crx"

      - name: Remove the signing key
        if: always()
        run: rm -f signing-key.pem

      # Attests the CRX rather than the zip, because the CRX is what reaches the store.
      - name: Attest the package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.crx.outputs.crx }}

      - id: auth
        if: ${{ !inputs.skip_store }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          # Without this the action exports CLOUDSDK_CORE_PROJECT, GCLOUD_PROJECT and
          # friends into the step environment, where Actions prints them unmasked. On a
          # public repository that publishes the Google Cloud project id in the log, which
          # defeats the reason WIF_SERVICE_ACCOUNT is a secret at all: its value contains
          # that project id. Only the access_token output is used here, so nothing needs
          # the exported environment.
          export_environment_variables: false
          create_credentials_file: false

      - name: Upload and stage in the Chrome Web Store
        if: ${{ !inputs.skip_store }}
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.EXTENSION_ID }}
          # Renamed from CWS_ZIP, because it holds a CRX. CWS_REQUIRE_CRX is gone: the
          # script requires a signed CRX unconditionally now, since whether one is required
          # is a property of the store item rather than of this invocation.
          CWS_PACKAGE: ${{ steps.crx.outputs.crx }}
          CWS_PUBLISH: 'true'
          # Staged by default: reviewed, then held, and promoting later needs no second
          # review. Choosing DEFAULT_PUBLISH here skips the hold and goes live on approval,
          # which is the right choice when nobody is going to come back and promote it.
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type }}
        run: node tools/cws_publish.mjs

      # Only now, with the package accepted by the store, does anything become permanent.
      # This used to run before the upload, so a store failure left a pushed tag and a
      # bumped main with nothing shipped, and the version gate then refused the retry.
      #
      # Known limitation: the attestation above names the checked-out commit, which is main
      # before this bump, so it attests "this workflow in this repo built these bytes"
      # rather than pinning a commit whose manifest carries the released version. That is
      # the useful claim; pinning the commit would need the bump pushed before the build,
      # which reintroduces the failure this ordering exists to prevent.
      - name: Commit the version, and tag it
        if: ${{ !inputs.skip_store }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json
          # On a first release the manifest already carries the version being released, so
          # there is genuinely nothing to commit. git commit exits 1 for that, which under
          # bash -e would fail the job. An empty diff is a valid state here, not an error.
          if git diff --cached --quiet; then
            echo "manifest already at ${{ inputs.version }}, nothing to commit"
          else
            git commit -m "Release ${{ inputs.version }}"
          fi
          # Annotated, and pushed by name. --follow-tags pushes annotated tags only, so a
          # lightweight tag never reached origin and gh release create then invented its own
          # at whatever main pointed to.
          git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          # Atomic, so a tag never lands without its commit.
          git push --atomic origin HEAD:main "refs/tags/v${{ inputs.version }}"

      # After the store, deliberately. A store failure used to leave a pushed tag, a bumped
      # main and a public prerelease with nothing in the store, and the version gate then
      # refused the retry because the tag existed. Recovery meant deleting a tag and a
      # published release by hand. The reversible step runs before the permanent one, which
      # is the same reasoning that moved the commit and tag after the build.
      - name: Create the GitHub prerelease
        if: ${{ !inputs.skip_store }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "${{ steps.crx.outputs.crx }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --prerelease

      - name: Summary
        run: |
          {
            echo "### v${{ inputs.version }}"
            echo
            echo "- GitHub prerelease created, with the signed CRX attached and attested"
            if [ "${{ inputs.skip_store }}" = "true" ]; then
              echo "- Chrome Web Store: skipped"
            elif [ "${{ inputs.publish_type }}" = "DEFAULT_PUBLISH" ]; then
              echo "- Chrome Web Store: submitted for review, and goes live on approval"
              echo
              echo "No further step is needed. It reaches users when review passes."
            else
              echo "- Chrome Web Store: submitted for review and held (STAGED_PUBLISH)"
              echo
              echo "It will NOT reach users until you run **Promote a release**."
              echo "That needs no second review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
