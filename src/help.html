<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connection needed</title>
    <link rel="stylesheet" href="help.css" />
  </head>
  <body>
    <main class="card">
      <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <symbol id="tsmark" viewBox="0 0 24 24">
          <g fill="currentColor">
            <circle cx="5" cy="5" r="2.7" opacity=".3" />
            <circle cx="12" cy="5" r="2.7" opacity=".3" />
            <circle cx="19" cy="5" r="2.7" opacity=".3" />
            <circle cx="5" cy="12" r="2.7" />
            <circle cx="12" cy="12" r="2.7" />
            <circle cx="19" cy="12" r="2.7" />
            <circle cx="5" cy="19" r="2.7" opacity=".3" />
            <circle cx="12" cy="19" r="2.7" />
            <circle cx="19" cy="19" r="2.7" opacity=".3" />
          </g>
        </symbol>
      </svg>

      <div class="pill" id="pill">
        <span class="pill-dot" id="pillDot"></span>
        <span id="pillText"></span>
      </div>

      <img class="logo" id="logo" alt="" hidden />
      <h1 id="headline"></h1>
      <p class="lede" id="lede"></p>

      <!-- Illustration of the Tailscale client, rebuilt in markup so the account row can
           carry the configured tenant rather than a baked-in screenshot. -->
      <section class="illustration" id="illustration" aria-label="Where to find Tailscale on your device">
        <div class="menubar">
          <span class="glyph glyph-square"></span>
          <svg class="glyph" viewBox="0 0 16 12" aria-hidden="true">
            <path d="M1 4.2a10 10 0 0 1 14 0M3.6 7a6.4 6.4 0 0 1 8.8 0" fill="none"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="8" cy="10" r="1.1" fill="currentColor" />
          </svg>
          <span class="glyph glyph-active"><svg class="mark bright" aria-hidden="true"><use href="#tsmark" /></svg></span>
          <span class="clock">13:37</span>
        </div>

        <div class="illustration-body">
          <div class="icon-key">
            <p class="icon-key-title">How the icon looks</p>
            <div class="tiles">
              <figure>
                <div class="tile dim"><svg class="mark faint" aria-hidden="true"><use href="#tsmark" /></svg></div>
                <figcaption>Disconnected</figcaption>
              </figure>
              <figure>
                <div class="tile"><svg class="mark bright" aria-hidden="true"><use href="#tsmark" /></svg></div>
                <figcaption>Connected</figcaption>
              </figure>
            </div>
          </div>

          <div class="menu">
            <div class="menu-head">
              <div>
                <p class="menu-title">Tailscale</p>
                <p class="menu-sub" id="menuState">Not Connected</p>
              </div>
              <span class="toggle" id="menuToggle" aria-hidden="true"><span class="knob"></span></span>
              <svg class="cursor" viewBox="0 0 12 16" aria-hidden="true">
                <path d="M1 1 L1 13 L4.2 10.2 L6.3 14.6 L8.4 13.6 L6.3 9.3 L10.5 9.3 Z"
                      fill="#fff" stroke="rgba(0,0,0,.5)" stroke-width="0.9"
                      stroke-linejoin="round" />
              </svg>
            </div>
            <hr />
            <div class="menu-row">
              <span class="avatar" aria-hidden="true"></span>
              <div class="menu-account">
                <p class="menu-email" id="menuEmail"></p>
                <p class="menu-tailnet" id="menuTailnet"></p>
              </div>
              <span class="chevron" aria-hidden="true"></span>
            </div>
            <hr />
            <div class="menu-row simple"><span>Settings…</span><span class="shortcut">⌘,</span></div>
            <div class="menu-row simple"><span>Open Tailscale</span></div>
            <hr />
            <p class="menu-managed" id="menuManaged"></p>
          </div>
        </div>
      </section>

      <p class="caption" id="caption">
        Click the Tailscale icon, then flip the toggle on. On Windows the icon lives in the
        system tray, bottom right.
      </p>

      <ol class="steps" id="steps"></ol>

      <p class="runbook" id="runbookWrap" hidden>
        <a id="runbook" rel="noreferrer">Our connection guide</a>
      </p>

      <div class="actions">
        <button type="button" class="primary" id="retry">Try again now</button>
        <a class="secondary" id="askIt" hidden rel="noreferrer"></a>
        <a class="secondary" id="download" hidden rel="noreferrer">Install Tailscale</a>
      </div>

      <p class="details" id="details"></p>
    </main>

    <script type="module" src="help.js"></script>
  </body>
</html>
